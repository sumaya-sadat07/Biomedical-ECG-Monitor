<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive ECG Signal Analyzer</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 900px;
            background: #111827;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #1f2937;
        }
        h2 {
            margin-top: 0;
            color: #34d399;
            text-align: center;
            font-size: 24px;
            letter-spacing: 1px;
        }
        p.subtitle {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 20px;
        }
        canvas {
            background: #030712;
            width: 100%;
            height: 300px;
            border-radius: 8px;
            border: 1px solid #374151;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .metric-card {
            background: #1f2937;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #374151;
        }
        .metric-title {
            font-size: 11px;
            color: #9ca3af;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .metric-value {
            font-size: 18px;
            font-weight: bold;
            color: #34d399;
        }
        .controls {
            margin-top: 25px;
            background: #1f2937;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #374151;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
            margin-right: 20px;
        }
        input[type=range] {
            flex-grow: 1;
            accent-color: #34d399;
            cursor: pointer;
        }
        button {
            background-color: #34d399;
            color: #030712;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #10b981;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ECG Signal Analyzer</h2>
        <p class="subtitle">Interactive Biomedical Signal Monitor & Simulator</p>
        
        <canvas id="ecgCanvas"></canvas>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">HEART RATE</div>
                <div class="metric-value" id="hrDisplay">75 BPM</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">RHYTHM STATUS</div>
                <div class="metric-value" id="rhythmDisplay" style="color: #60a5fa;">Normal</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">PR INTERVAL</div>
                <div class="metric-value" id="prDisplay">160 ms</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">SIGNAL QUALITY</div>
                <div class="metric-value" id="qualityDisplay" style="color: #34d399;">Stable</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <span id="sliderLabel" style="font-size: 14px; font-weight: 500;">Heart Rate Control: 75 BPM</span>
                <input type="range" id="hrSlider" min="40" max="180" value="75">
            </div>
            <button id="freezeBtn">Freeze Signal</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('ecgCanvas');
        const ctx = canvas.getContext('2d');
        const hrSlider = document.getElementById('hrSlider');
        const hrDisplay = document.getElementById('hrDisplay');
        const rhythmDisplay = document.getElementById('rhythmDisplay');
        const prDisplay = document.getElementById('prDisplay');
        const qualityDisplay = document.getElementById('qualityDisplay');
        const sliderLabel = document.getElementById('sliderLabel');
        const freezeBtn = document.getElementById('freezeBtn');

        // Setup Canvas Size
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;

        let heartRate = 75;
        let isFrozen = false;
        let waveIndex = 0;
        let dataPoints = [];
        let maxPoints = canvas.width;
        let lastBeatTime = 0;

        // Generate Beep Sound using Web Audio API
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                // Handle browser audio policy limitations
            }
        }

        // Initialize initial amplitude array
        for (let i = 0; i < maxPoints; i++) {
            dataPoints.push(canvas.height / 2);
        }

        function getECGValue(x) {
            let cycleLength = mapRange(heartRate, 40, 180, 250, 80); 
            let pos = x % cycleLength;
            let baseline = canvas.height / 2;

            // Add slight noise to waveform when signal quality fluctuates
            let noise = 0;
            if (heartRate > 150 || heartRate < 48) {
                noise = (Math.random() - 0.5) * 8;
            }

            // P Wave
            if (pos > 20 && pos < 40) return baseline - 8 * Math.sin((pos - 20) / 20 * Math.PI) + noise;
            // PR Segment
            if (pos >= 40 && pos < 55) return baseline + noise;
            // Q Wave
            if (pos >= 55 && pos < 60) return baseline + 10 + noise;
            // R Wave (QRS Complex Peak)
            if (pos >= 60 && pos < 68) return baseline - 90 * Math.sin((pos - 60) / 8 * Math.PI) + noise;
            // S Wave
            if (pos >= 68 && pos < 75) return baseline + 25 + noise;
            // ST Segment
            if (pos >= 75 && pos < 100) return baseline + noise;
            // T Wave
            if (pos >= 100 && pos < 130) return baseline - 18 * Math.sin((pos - 100) / 30 * Math.PI) + noise;

            return baseline + noise;
        }

        function mapRange(value, inMin, inMax, outMin, outMax) {
            return (value - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
        }

        function updateMetrics(bpm) {
            hrDisplay.textContent = bpm + " BPM";
            sliderLabel.textContent = "Heart Rate Control: " + bpm + " BPM";

            // Update Rhythm Status
            if (bpm > 100) {
                rhythmDisplay.textContent = "Tachycardia";
                rhythmDisplay.style.color = "#f87171"; // Red
            } else if (bpm < 60) {
                rhythmDisplay.textContent = "Bradycardia";
                rhythmDisplay.style.color = "#fbbf24"; // Yellow
            } else {
                rhythmDisplay.textContent = "Normal";
                rhythmDisplay.style.color = "#60a5fa"; // Blue
            }

            // Calculate Dynamic PR Interval
            let calculatedPR = Math.round(180 - (bpm * 0.15));
            prDisplay.textContent = calculatedPR + " ms";

            // Update Signal Quality
            if (bpm > 150) {
                qualityDisplay.textContent = "Artifacts";
                qualityDisplay.style.color = "#f87171";
            } else if (bpm < 48) {
                qualityDisplay.textContent = "Unstable";
                qualityDisplay.style.color = "#fbbf24";
            } else {
                qualityDisplay.textContent = "Stable";
                qualityDisplay.style.color = "#34d399";
            }
        }

        function animate() {
            if (!isFrozen) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Grid Lines
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 1;
                for (let x = 0; x < canvas.width; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += 40) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }

                // Add New ECG Point
                waveIndex += mapRange(heartRate, 40, 180, 1.5, 3.5);
                let currentVal = getECGValue(waveIndex);
                
                dataPoints.push(currentVal);
                dataPoints.shift();

                // Trigger Heartbeat Sound
                let now = Date.now();
                let beatIntervalMs = (60 / heartRate) * 1000;
                if (now - lastBeatTime > beatIntervalMs) {
                    playBeep();
                    lastBeatTime = now;
                }

                // Draw ECG Signal Line
                ctx.strokeStyle = '#34d399';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < dataPoints.length; i++) {
                    if (i === 0) ctx.moveTo(i, dataPoints[i]);
                    else ctx.lineTo(i, dataPoints[i]);
                }
                ctx.stroke();
            }
            requestAnimationFrame(animate);
        }

        // Slider Event Listener
        hrSlider.addEventListener('input', (e) => {
            heartRate = parseInt(e.target.value);
            updateMetrics(heartRate);
        });

        // Freeze Button Toggle
        freezeBtn.addEventListener('click', () => {
            isFrozen = !isFrozen;
            freezeBtn.textContent = isFrozen ? "Resume Signal" : "Freeze Signal";
            freezeBtn.style.backgroundColor = isFrozen ? "#60a5fa" : "#34d399";
        });

        // Initial Call
        updateMetrics(heartRate);
        animate();
    </script>
</body>
</html>
